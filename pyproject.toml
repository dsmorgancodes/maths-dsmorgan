[project]
name = "maths-dsmorgan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
notes = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
