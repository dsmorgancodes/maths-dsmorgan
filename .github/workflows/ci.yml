name: CI

on:
  push:
    branches: [working, publish]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CI has no TeX; build/ is made locally by tools/publish.py before deploying.
      - run: mkdir -p build
      - run: docker build -t maths-dsmorgan .
